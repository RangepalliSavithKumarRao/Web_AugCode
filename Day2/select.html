<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>select</title>
</head>
<body>
    <select>
        <option>India</option>
        <option>Germany</option>
        <option>China</option>
        <option disabled selected >Country</option>
        <option label="Usa">United States of America</option>

    </select>
    <select disabled>
        
    </select>
    <select required>
        <option selected disabled>Age</option>
        <option>0-10</option>
        <option>11-20</option>
        <option>21-30</option>
        <option>31-40</option>
        <option>41-50</option>
        <option>50 above</option>


    </select>
    <select multiple>
        <option selected disabled>Gender</option>

        <option>Male</option>
        <option>Female</option>
        <option>Prefer not to say</option>

    </select>
    <select>
        <option selected disabled>sort by:</option>
        <option>price:low to high</option>
        <option>price:high to low</option>
    </select>
</body>
</html>
