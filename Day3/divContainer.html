<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>divContainer</title>
</head>
<body>
    <div style="background-color: aqua; width:250px">
        <p>hello world</p>
        <h2>hello</h2>
    </div>
<div style="background-color: red; width:150px">
        <p>ram ram</p>
        <h2>hare krishna</h2>
    </div>
    <p>hello world</p>
    <p>hello <span>world</span></p>
    <button>click me 1</button>
<button>click me <span style="background-color:blueviolet">2</span></button>
</body>
</html>
