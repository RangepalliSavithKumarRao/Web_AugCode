<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let luckyNo=1+Math.floor(Math.random()*6)
        // console.log(luckyNo)
        while(true){
            let guessNo=prompt("Enter no between 1 to 6")
            if(guessNo==luckyNo){
                alert("You won")
                break;
            }
            else{
                alert("Better luck next time")
            }
        }
    </script>
</body>
</html>
